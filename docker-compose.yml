services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8090}
    volumes:
      - profiles-data:/data

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  profiles-data:
